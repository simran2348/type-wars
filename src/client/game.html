<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="game.css" />
    <title>Type Wars</title>
  </head>

  <body>
    <div id="app">
      <div id="game-container"></div>
      <!-- Focused on touch devices so the on-screen keyboard appears. -->
      <input
        id="touch-keyboard"
        type="text"
        aria-label="Type the meteor words"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        enterkeyhint="done"
      />
    </div>
    <script type="module" src="game.ts"></script>
  </body>
</html>
