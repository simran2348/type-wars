<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" type="text/css" href="splash.css" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, width=device-width, height=device-height, user-scalable=0"
    />
    <title>Type Wars</title>
  </head>
  <body class="app">
    <canvas class="stars" id="stars" aria-hidden="true"></canvas>
    <button class="admin-toggle" id="admin-toggle" type="button" hidden>
      Admin
    </button>
    <div
      class="admin-panel"
      id="admin-panel"
      role="dialog"
      aria-label="Admin"
      hidden
    >
      <h2>Admin</h2>
      <p>Permanently deletes every score on Today's Best and All Time.</p>
      <button class="admin-reset" id="admin-reset" type="button">
        Reset all scores
      </button>
    </div>
    <div class="content">
      <h1 class="title">TYPE WARS</h1>
      <p class="subtitle">A typing space shooter</p>
      <button class="play-button" id="play-button">PLAY</button>
      <section class="boards" aria-label="Leaderboards">
        <div class="board">
          <h2>Today's Best</h2>
          <ol id="board-today">
            <li class="empty">Loading…</li>
          </ol>
        </div>
        <div class="board">
          <h2>All Time</h2>
          <ol id="board-all-time">
            <li class="empty">Loading…</li>
          </ol>
        </div>
      </section>
    </div>
    <script type="module" src="splash.ts"></script>
  </body>
</html>
